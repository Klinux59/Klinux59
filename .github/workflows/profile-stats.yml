name: Update public profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * *'
  push:
    paths:
      - scripts/update_activity.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate public activity card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Save updated card
        run: |
          if [ -n "$(git status --porcelain -- assets/activity.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/activity.svg
            git commit -m "Update public GitHub activity"
            git push
          fi

