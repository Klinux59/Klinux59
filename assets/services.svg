<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc"><title id="title">Thanaphat.59</title><desc id="desc">Five areas: online game systems, web development, top-up systems, custom scripts and game servers.</desc><g font-family="Segoe UI,Tahoma,Arial,sans-serif"><rect x="1" y="1" width="584" height="220" rx="16" fill="#0f192a" stroke="#2c3d58"/><rect x="22" y="22" width="60" height="60" rx="15" fill="#16283b"/><g transform="translate(24,24) scale(.96)" fill="none" stroke="#78dce9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22h28l8 20c2 8-5 12-10 6l-5-6H21l-5 6c-5 6-12 2-10-6z"/><path d="M17 29v12m-6-6h12"/><circle cx="36" cy="31" r="2"/><circle cx="42" cy="37" r="2"/></g><text x="102" y="46" font-size="12" fill="#78dce9" letter-spacing="1.7" font-weight="600">ONLINE GAME SYSTEMS</text><text x="102" y="72" font-size="10" fill="#6e87a8" letter-spacing="1.3">01 / DEVELOPMENT FOCUS</text><text x="24" y="116" font-size="25" fill="#edf3ff" font-weight="600">ระบบสำหรับคอมมูนิตี้เกม</text><text x="24" y="151" font-size="17" fill="#a8bbd4" >เชื่อมระบบภายในเกมและส่วนต่าง ๆ ให้ทำงานร่วมกัน</text><text x="24" y="190" font-size="10" fill="#78dce9" letter-spacing="1.6">GAME LOGIC / INTEGRATIONS</text><rect x="615" y="1" width="584" height="220" rx="16" fill="#0f192a" stroke="#2c3d58"/><rect x="636" y="22" width="60" height="60" rx="15" fill="#16283b"/><g transform="translate(638,24) scale(.96)" fill="none" stroke="#a6adff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="12" width="44" height="34" rx="5"/><path d="M6 23h44m-27 7-7 5 7 5m10-10 7 5-7 5"/><path d="M13 18h1m6 0h1"/></g><text x="716" y="46" font-size="12" fill="#a6adff" letter-spacing="1.7" font-weight="600">WEB DEVELOPMENT</text><text x="716" y="72" font-size="10" fill="#6e87a8" letter-spacing="1.3">02 / DEVELOPMENT FOCUS</text><text x="638" y="116" font-size="25" fill="#edf3ff" font-weight="600">เว็บไซต์และระบบจัดการ</text><text x="638" y="151" font-size="17" fill="#a8bbd4" >หน้าเว็บสำหรับเกม คอมมูนิตี้ และการจัดการข้อมูล</text><text x="638" y="190" font-size="10" fill="#a6adff" letter-spacing="1.6">FRONTEND / BACKEND</text><rect x="1" y="245" width="584" height="220" rx="16" fill="#0f192a" stroke="#2c3d58"/><rect x="22" y="266" width="60" height="60" rx="15" fill="#16283b"/><g transform="translate(24,268) scale(.96)" fill="none" stroke="#e4c578" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="15" width="44" height="32" rx="5"/><path d="M8 15v-5h34v5"/><rect x="32" y="26" width="18" height="12" rx="3"/><circle cx="38" cy="32" r="1.5"/></g><text x="102" y="290" font-size="12" fill="#e4c578" letter-spacing="1.7" font-weight="600">TOP-UP SYSTEMS</text><text x="102" y="316" font-size="10" fill="#6e87a8" letter-spacing="1.3">03 / DEVELOPMENT FOCUS</text><text x="24" y="360" font-size="25" fill="#edf3ff" font-weight="600">ระบบเติมเงินเชื่อมเว็บและเกม</text><text x="24" y="395" font-size="17" fill="#a8bbd4" >จัดการข้อมูลการเติมเงินและเชื่อมระบบที่เกี่ยวข้อง</text><text x="24" y="434" font-size="10" fill="#e4c578" letter-spacing="1.6">TOP-UP / API / DATABASE</text><rect x="615" y="245" width="584" height="220" rx="16" fill="#0f192a" stroke="#2c3d58"/><rect x="636" y="266" width="60" height="60" rx="15" fill="#16283b"/><g transform="translate(638,268) scale(.96)" fill="none" stroke="#b79be9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 16-12 14 12 14m22-28 12 14-12 14m-6-31-10 34"/></g><text x="716" y="290" font-size="12" fill="#b79be9" letter-spacing="1.7" font-weight="600">CUSTOM SCRIPTS</text><text x="716" y="316" font-size="10" fill="#6e87a8" letter-spacing="1.3">04 / DEVELOPMENT FOCUS</text><text x="638" y="360" font-size="25" fill="#edf3ff" font-weight="600">สคริปต์ตามรูปแบบการใช้งาน</text><text x="638" y="395" font-size="17" fill="#a8bbd4" >เพิ่มฟีเจอร์ ปรับพฤติกรรม และลดขั้นตอนที่ทำซ้ำ</text><text x="638" y="434" font-size="10" fill="#b79be9" letter-spacing="1.6">CUSTOM LOGIC / AUTOMATION</text><rect x="1" y="489" width="1198" height="220" rx="16" fill="#0f192a" stroke="#2c3d58"/><rect x="22" y="510" width="60" height="60" rx="15" fill="#16283b"/><g transform="translate(24,512) scale(.96)" fill="none" stroke="#83d5af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="44" height="17" rx="4"/><rect x="6" y="32" width="44" height="17" rx="4"/><path d="M14 17h1m7 0h1m10 0h10M14 40h1m7 0h1m10 0h10"/></g><text x="102" y="534" font-size="12" fill="#83d5af" letter-spacing="1.7" font-weight="600">GAME SERVERS</text><text x="102" y="560" font-size="10" fill="#6e87a8" letter-spacing="1.3">05 / DEVELOPMENT FOCUS</text><text x="24" y="604" font-size="25" fill="#edf3ff" font-weight="600">เปิดและปรับแต่งเซิร์ฟเวอร์เกม</text><text x="24" y="639" font-size="17" fill="#a8bbd4" >ตั้งค่าเซิร์ฟเวอร์ เชื่อมต่อระบบ และดูแลการทำงาน</text><text x="24" y="678" font-size="10" fill="#83d5af" letter-spacing="1.6">SETUP / CONFIGURATION / TOOLS</text><g transform="translate(800,540)" fill="none" stroke="#4a7e70" stroke-width="2"><path d="M0 37h300"/><rect x="0" y="16" width="72" height="42" rx="8" fill="#132e2b"/><rect x="115" y="16" width="72" height="42" rx="8" fill="#132e2b"/><rect x="230" y="16" width="72" height="42" rx="8" fill="#132e2b"/></g><text x="836" y="582" font-size="10" fill="#a1dfc1" text-anchor="middle">SETUP</text><text x="951" y="582" font-size="10" fill="#a1dfc1" text-anchor="middle">CONFIG</text><text x="1066" y="582" font-size="10" fill="#a1dfc1" text-anchor="middle">TOOLS</text></g></svg>